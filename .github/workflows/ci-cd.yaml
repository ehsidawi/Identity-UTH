name: CI/CD
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Build
        run: cd control-plane && go build -o fabric-control-plane main.go
      - name: Test
        run: cd control-plane && go test -v ./...
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: fabric-control-plane-linux
          path: control-plane/fabric-control-plane
