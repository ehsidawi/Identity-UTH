apiVersion: v1
kind: Namespace
metadata:
  name: identity-security-fabric
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: control-plane
  namespace: identity-security-fabric
spec:
  serviceName: control-plane
  replicas: 3
  selector:
    matchLabels:
      app: control-plane
  template:
    metadata:
      labels:
        app: control-plane
    spec:
      containers:
      - name: fabric-orchestrator
        image: identity-uth:latest
        ports:
        - containerPort: 8080
        - containerPort: 9090
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
